services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: tcg_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: tgc-scanner-api-dev
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: tcg_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./services/api:/app
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    # The source bind mount can replace the image's normalized entrypoint with
    # a Windows CRLF copy. Normalize it after mounting and before execution.
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -i 's/\r$//' /app/entrypoint.sh
        exec /app/entrypoint.sh "$$@"
      - --
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  cleanup:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["python", "-m", "app.commands.cleanup_scans", "--loop"]
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      api:
        condition: service_healthy

  web:
    image: tgc-scanner-web-dev
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: tcg_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server-side Next.js rewrites run inside this container and must address
      # the API by its Docker service name, never by localhost.
      API_INTERNAL_URL: ${DEV_API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    volumes:
      - ./apps/web:/app
      - web_node_modules_dev:/app/node_modules
      - web_next_dev:/app/.next
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: ["npm", "run", "dev"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  mariadb_data:
  uploads_data:
  web_node_modules_dev:
  web_next_dev:
